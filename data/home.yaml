intro: |
  I was named after a military patrol car. I'll explain later, or you can [skip ahead](/articles/garnisun/).

  For twelve years I helped build SoftwareSeni, a software company in Yogyakarta, and now I run [Synetica](https://synetica.co), a smaller one that helps people find out whether their product will work before they spend a fortune on it. Before work I run, slowly. After work I'm a father of two, and between six and nine in the evening the phone goes in a drawer.

  This is where I write, in English and in Bahasa, about building companies, about books, and about the distance between what I planned and what actually happened, which is the only thing I'm really an expert in. Each essay is set in the manner of a different designer from a different century. I love typography more than is healthy, and this seemed cheaper than therapy.
now_date: "October 2026"
now:
  - k: "Building"
    v: "[Synetica](https://synetica.co), ten months in. Two weeks to a tested prototype, eight to a real product. Mostly internal tools for companies still running on spreadsheets and WhatsApp."
  - k: "Theme"
    v: "*Prove*: the business, my health and being at home for dinner. All three, at the same time, which is the hard part."
  - k: "Running"
    v: "Mornings around UGM. My AI coach sends me red siren emojis when I skip a week. It's usually right."
  - k: "Writing"
    v: "This website, apparently. My 2026 goal was six art-directed essays. I got a little carried away."
truths:
  - "I'm a lion at ping-pong and a chicken at parties. I learned ping-pong in a room so narrow you couldn't step back, only sideways."
  - "I was SoftwareSeni's thirteenth employee. I left twelve years later, which I've decided isn't a coincidence."
  - "I keep a note on my phone to remember my baristas: *Mas Imbu. Buzzcut.*"
  - "My father's best joke was a pun about fruit and money. I inherited the joke and, worse, the face that goes with it."
  - "I think Bringhurst's *The Elements of Typographic Style* is about as close to a bible as I've got. My favourite typeface is Chaparral."
  - "I have owned 71 mechanical keyboards and scored every one in a spreadsheet. I sold the two best. One of the five I kept has never been scored, so officially it's a zero."
  - "I've uninstalled Mobile Legends more times than I've finished a marathon. Considerably more."
  - "If I'm ever in a coma, play me Explosions in the Sky. I've put that in writing."
  - "At two I was shipped from Papua to Malang on the KM Rinjani, which was also two. We were both very small for the journey."
