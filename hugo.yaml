baseURL: 'https://ganisatmawarin.com/'
locale: 'id'
languageName: 'Indonesian'
title: 'Ganis Angger Atmawarin'
enableRobotsTXT: true
summaryLength: 40

taxonomies:
  category: categories # reading shelf
  tag: tags            # essays

outputs:
  home: ["HTML", "RSS"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      typographer:
        disable: false

menus:
  main:
    - name: "Writing"
      weight: 10
      url: "/articles/"
    - name: "Reading"
      weight: 20
      url: "/reading/"
    - name: "Running"
      weight: 30
      url: "/running/"
    - name: "About"
      weight: 40
      url: "/about/"
    - name: "Letters"
      weight: 50
      url: "/newsletter/"

  footer:
    - name: "Writing"
      weight: 10
      url: "/articles/"
    - name: "Reading"
      weight: 20
      url: "/reading/"
    - name: "Running"
      weight: 30
      url: "/running/"
    - name: "Running log"
      weight: 35
      url: "/running/log/"
    - name: "About"
      weight: 40
      url: "/about/"
    - name: "Questions & ideas"
      weight: 50
      url: "/questions-and-ideas/"
    - name: "Favourite things"
      weight: 60
      url: "/favourite/"
    - name: "Colophon"
      weight: 70
      url: "/colophon/"
    - name: "RSS"
      weight: 80
      url: "/index.xml"

params:
  description: "Personal site of Ganis Angger Atmawarin: essays on building companies, typography, running and family, written from Yogyakarta. Founder of Synetica, twelve years at SoftwareSeni."
  author: "Ganis Angger Atmawarin"
  email: "ganis@atmawarin.com"
  location: "Yogyakarta, Indonesia"
  image: "images/og-default.png"
  newsletter_action: "https://atmawarin.us4.list-manage.com/subscribe/post?u=14e57e1e8c6e66dc0fd26741c&id=1ea4f07034"
  # Set one of these to switch analytics on (production builds only).
  analytics:
    ga4: ""
    plausible: ""
  sameAs:
    - "https://synetica.co"

# Local dev only: `hugo server` ignores netlify.toml, so the /running/log proxy
# 404s locally. Send it to the dashboard's own domain instead. Production builds
# don't use this block.
server:
  redirects:
    - from: "/running/log/**"
      to: "https://run.ganisatmawarin.com/"
      status: 302
