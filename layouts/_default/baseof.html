<!DOCTYPE html>
{{- $lang := .Params.lang_code | default (cond .IsPage "id" "en") }}
<html lang="{{ $lang }}">
<head>
    {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}page{{ end }}">
    <a class="skip" href="#main">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main">
    {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "javascript.html" . }}
</body>
</html>
