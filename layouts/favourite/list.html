{{ define "main" }}
<section class="title-block">
    <p class="slug">Favourite things</p>
    <h1 class="title-block__h">{{ .Title }}</h1>
    {{ with .Content }}<div class="title-block__dek">{{ . }}</div>{{ end }}
</section>
<div class="notes">
    {{ range .Pages.ByWeight }}
    <article class="note">
        <span class="note__kind">{{ .Params.type }}</span>
        <h2>{{ with .Params.link }}<a href="{{ . }}" rel="noopener">{{ end }}{{ .Title }}{{ with .Params.link }}</a>{{ end }}</h2>
        {{ with .Params.image }}<img src="{{ . | relURL }}" alt="" loading="lazy">{{ end }}
        <div class="note__body">{{ .Content }}</div>
    </article>
    {{ end }}
</div>
{{ end }}
