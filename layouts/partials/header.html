<header class="masthead">
    <a class="masthead__name" href="{{ site.Home.RelPermalink }}" aria-label="Ganis Angger Atmawarin, home">
        <span class="masthead__mark" aria-hidden="true">G</span>
        <span class="masthead__full">Ganis Angger Atmawarin</span>
    </a>
    <nav class="masthead__nav" aria-label="Main">
        {{- $here := .RelPermalink }}
        {{- range site.Menus.main }}
        <a href="{{ .URL }}"{{ if hasPrefix $here .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{- end }}
    </nav>
</header>
