{{ define "main" }}
<section class="title-block">
    <p class="slug">Notebook</p>
    <h1 class="title-block__h">{{ .Title }}</h1>
    <p class="title-block__dek">{{ .Params.subtitle }}</p>
</section>
<div class="notes">
    {{ range .Pages.ByDate.Reverse }}
    <article class="note" id="{{ .File.ContentBaseName }}">
        <span class="note__kind">{{ if eq .Type "question" }}Question{{ else }}Idea{{ end }} · {{ .Date.Format "Jan 2006" }}</span>
        <h2>{{ replaceRE "^[^A-Za-z0-9]+" "" .Title }}</h2>
        <div class="note__body">{{ .Content }}</div>
    </article>
    {{ end }}
</div>
{{ end }}
