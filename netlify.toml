[build]
  command = "hugo --gc --minify --baseURL https://ganisatmawarin.com/"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.163.2"
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

# The running dashboard is its own repo and Netlify site (run.ganisatmawarin.com):
# it takes workout POSTs from the phone and keeps data in Netlify Blobs. Proxy it
# here so visitors stay on one domain; the dashboard uses relative paths for this.
[[redirects]]
  from = "/running/log"
  to = "https://run.ganisatmawarin.com/"
  status = 200

[[redirects]]
  from = "/running/log/*"
  to = "https://run.ganisatmawarin.com/:splat"
  status = 200

# Retired essays (2026 redesign): dated tool reviews and a merged draft.
[[redirects]]
  from = "/articles/buat-presentasi-dengan-beautiful-ai/"
  to = "/articles/"
  status = 301

[[redirects]]
  from = "/articles/rekomendasi-note-taking-app-notion/"
  to = "/articles/"
  status = 301

[[redirects]]
  from = "/articles/6-alasan-pindah-dari-wordpress-ke-webflow/"
  to = "/articles/"
  status = 301

[[redirects]]
  from = "/articles/three-months-running-my-own-company/"
  to = "/articles/three-months-a-field-note-from-a-small-company/"
  status = 301

# Book, race and note stubs are no longer rendered as their own pages (2026).
[[redirects]]
  from = "/reading/*"
  to = "/reading/"
  status = 301

[[redirects]]
  from = "/questions-and-ideas/*"
  to = "/questions-and-ideas/"
  status = 301

[[redirects]]
  from = "/favourite/*"
  to = "/favourite/"
  status = 301
